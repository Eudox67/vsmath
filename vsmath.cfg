# #### FPC configuration fragment for the vsmath package (1.0.0).
# ####
# #### Use it without a package installer:
# ####
# ####   fpc @vsmath.cfg MyProgram.pas          # run from the package root
# ####   fpc -n @vsmath.cfg MyProgram.pas       # ignore the global fpc.cfg
# ####
# #### The -Fu/-Fi paths below are relative to the current working directory,
# #### not to this file, so either run fpc from the package root or replace
# #### ./src with the directory the units were installed into
# #### (fpmake install puts them under <prefix>/lib/fpc/<version>/vsmath).
# ###########################################################

# unit search path and include path for src/*.inc (VsMath_CPU.inc)
-Fu./src
-Fi./src

# the units assume objfpc mode with ansistrings; match the package build
-Mobjfpc
-O1

# No -dx64: the kernel units guard their bodies with FPC's own CPUX64 macro.
